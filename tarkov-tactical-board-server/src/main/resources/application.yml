server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:}

spring:
  config:
    # Allow IDE/local runs to read environment-style key=value pairs from the project root .env file.
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:tarkov_board}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_ROOT_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  auth:
    adminUsername: ${APP_AUTH_ADMINUSERNAME:${APP_ADMIN_USERNAME:admin}}
    # Required: bcrypt hash of the admin password. Set APP_AUTH_ADMINPASSWORDHASH.
    adminPasswordHash: ${APP_AUTH_ADMINPASSWORDHASH:${APP_ADMIN_PASSWORD_HASH:}}
  jwt:
    # Required in production: Base64 encoded 256-bit key for HS256. Set APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:}
    expireSeconds: ${APP_JWT_EXPIRESECONDS:7200}
